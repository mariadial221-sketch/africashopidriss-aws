<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/img/products/panier-thies.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css"><script src="assets/js/config.js"></script>
<title>Panier — AfricaShop</title></head>
<body><main class="wrap">
<div class="page-title"><h1>Votre panier</h1></div>
<div class="two"><section id="lines"></section>
<form class="panel" id="checkout"><h2 style="font-size:1.8rem">Finaliser la commande</h2>
<div class="field"><label for="email">Adresse email</label><input id="email" name="email" type="email" required placeholder="vous@exemple.com"></div>
<div class="field"><label for="country">Pays de livraison</label><select id="country" name="country">
<option value="SN">Sénégal</option><option value="CI">Côte d'Ivoire</option><option value="ML">Mali</option><option value="BF">Burkina Faso</option><option value="FR">France</option><option value="US">États-Unis</option></select></div>
<div class="field"><span style="font-size:.9rem;font-weight:500">Moyen de paiement</span><div class="pay-options">
<label><input type="radio" name="method" value="mobile_money" checked> Mobile Money (Wave, Orange Money, Free Money)</label>
<label><input type="radio" name="method" value="card"> Carte bancaire</label></div></div>
<p class="fine">Le paiement est confié à un prestataire certifié PCI DSS : AfricaShop ne voit, ne stocke ni ne transmet jamais vos données de carte.</p>
<button class="btn" id="pay" style="width:100%">Commander</button><div id="result"></div></form></div>
</main><script type="module" src="assets/js/panier.js"></script></body></html>
