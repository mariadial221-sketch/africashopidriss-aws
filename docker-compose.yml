# AfricaShop — toute la plateforme en local, en miroir de l'architecture AWS :
#   web (nginx)  ≈ CloudFront + ALB   |   api (x2)  ≈ Auto Scaling group   |   db  ≈ Amazon RDS
#   volume media ≈ bucket S3 des photos
# Démarrage : docker compose up -d --build   puis   http://localhost:8080
name: africashop

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: africashop
      POSTGRES_USER: africashop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-africashop-dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U africashop -d africashop"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      APP_ENV: docker
      DATABASE_URL: postgresql+psycopg://africashop:${POSTGRES_PASSWORD:-africashop-dev}@db:5432/africashop
      STORAGE_MODE: local
      LOCAL_MEDIA_DIR: /data/media
      MEDIA_PUBLIC_BASE: /media
      SERVE_FRONTEND: "false"
      EVENTS_MODE: log
      AUTH_MODE: none
      PSP_WEBHOOK_SECRET: ${PSP_WEBHOOK_SECRET:-dev-secret}
      CORS_ORIGINS: http://localhost:8080
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
    deploy:
      replicas: 2            # deux « instances » derrière le proxy : rafraîchissez et regardez le bandeau
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/srv/media:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Outil facultatif : docker compose --profile outils up -d   puis   http://localhost:8081
  adminer:
    image: adminer:4
    profiles: ["outils"]
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

volumes:
  pgdata:
  media:
