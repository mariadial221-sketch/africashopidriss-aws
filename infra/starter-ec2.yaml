AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  AfricaShop Starter - point de départ VOLONTAIREMENT naïf : une seule instance EC2 publique
  dans le VPC par défaut, base SQLite locale, photos sur le disque. Ça marche... jusqu'à la
  première panne. Votre travail : remplacer ce template par une architecture qui tient les exigences.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC par défaut du Learner Lab
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Un sous-réseau public du VPC par défaut
  ArtifactBucket:
    Type: String
    Description: Bucket S3 contenant releases/africashop-app.zip (créé par scripts/package.sh)
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small]
  InstanceProfileName:
    Type: String
    Default: LabInstanceProfile
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  WebSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: AfricaShop starter - HTTP ouvert a Internet
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
      Tags: [{ Key: Project, Value: africashop }]

  Web:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfileName
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref WebSg]
      MetadataOptions: { HttpTokens: required }
      Tags: [{ Key: Name, Value: africashop-starter }, { Key: Project, Value: africashop }]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y python3.11 python3.11-pip unzip
          id africashop || useradd -r -s /sbin/nologin africashop
          mkdir -p /opt/africashop && cd /opt/africashop
          aws s3 cp s3://${ArtifactBucket}/releases/africashop-app.zip app.zip --region ${AWS::Region}
          unzip -o app.zip
          python3.11 -m venv venv
          venv/bin/pip install --quiet -r backend/requirements.txt
          chown -R africashop /opt/africashop
          cd backend && sudo -u africashop ../venv/bin/python -m app.seed
          cat > /etc/systemd/system/africashop.service <<UNIT
          [Unit]
          Description=AfricaShop starter
          After=network-online.target
          [Service]
          User=africashop
          WorkingDirectory=/opt/africashop/backend
          Environment=APP_ENV=ec2
          AmbientCapabilities=CAP_NET_BIND_SERVICE
          ExecStart=/opt/africashop/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 80 --workers 2
          Restart=always
          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload
          systemctl enable --now africashop

Outputs:
  SiteUrl:
    Value: !Sub "http://${Web.PublicDnsName}"
    Description: "Rafraîchissez la page : le bandeau indique l'instance et l'AZ qui répondent"
