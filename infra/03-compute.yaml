AWSTemplateFormatVersion: "2010-09-09"
Description: >
  AfricaShop - Bloc 3 : calcul. Role IAM de moindre privilege, modele de lancement
  (Amazon Linux 2023, IMDSv2 obligatoire), Auto Scaling Group 2 a 6 instances sur 2 zones
  dans les sous-reseaux prives, Application Load Balancer avec health check sur /api/health.
  Necessite les blocs 1 (africashop-network) et 2 (africashop-data, avec ManagedPassword=true).
  A deployer avec --capabilities CAPABILITY_IAM.

Parameters:
  ProjectName:
    Type: String
    Default: africashop
    Description: Doit etre identique a celui des blocs 1 et 2.
  ArtifactBucket:
    Type: String
    Description: Bucket contenant releases/africashop-app.zip (cree par scripts/package.sh).
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t3.medium]
  AppPort:
    Type: Number
    Default: 8000
    Description: Doit etre identique a celui du bloc 1 (groupe de securite SG-APP).
  MinSize:
    Type: Number
    Default: 2
  MaxSize:
    Type: Number
    Default: 6
  DesiredCapacity:
    Type: Number
    Default: 2
  CpuTargetPercent:
    Type: Number
    Default: 50
    Description: Cible de CPU moyen pour la mise a l'echelle.
  RequestsPerTarget:
    Type: Number
    Default: 300
    Description: Requetes par instance et par minute avant d'ajouter une instance.
  TestCidr:
    Type: String
    Default: ""
    AllowedPattern: "^(([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2})?$"
    Description: >
      TEMPORAIRE : votre adresse IP publique en /32 (ex. 41.82.10.5/32) pour tester l'ALB
      directement depuis votre navigateur. Vide en usage normal (ALB joignable par CloudFront seul).

Conditions:
  HasTestCidr: !Not [!Equals [!Ref TestCidr, ""]]

Resources:
  # ---------------------------------------------------------------- Role des instances (moindre privilege)
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Session Manager : acces aux instances privees sans SSH ni port 22
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
      Policies:
        - PolicyName: read-app-release
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${ArtifactBucket}/releases/*"
        # Photos : l'application ne fait que signer des envois (PUT) sous products/*.
        # La lecture est faite par CloudFront (OAC), pas par les instances.
        - PolicyName: media-photos
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: UploadPhotosProduits
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub
                  - "${BucketArn}/products/*"
                  - BucketArn:
                      Fn::ImportValue: !Sub "${ProjectName}-MediaBucketArn"
        # Evenements de commande (bonus) : publication limitee au topic des commandes
        - PolicyName: publish-order-events
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: PublierEvenementsCommande
                Effect: Allow
                Action: sns:Publish
                Resource: !Sub "arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${ProjectName}-orders"
        - PolicyName: read-db-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  Fn::ImportValue: !Sub "${ProjectName}-DbSecretArn"
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-instance-role" }

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  # ---------------------------------------------------------------- Modele de lancement
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref AmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn
        SecurityGroupIds:
          - Fn::ImportValue: !Sub "${ProjectName}-AppSgId"
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
          HttpPutResponseHopLimit: 2
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 12
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - { Key: Name, Value: !Sub "${ProjectName}-app" }
              - { Key: Project, Value: !Ref ProjectName }
        UserData:
          Fn::Base64: !Sub
            - |
              #!/bin/bash
              set -euxo pipefail
              dnf install -y python3.11 python3.11-pip unzip
              id africashop || useradd -r -s /sbin/nologin africashop
              mkdir -p /opt/africashop && cd /opt/africashop
              aws s3 cp s3://${ArtifactBucket}/releases/africashop-app.zip app.zip --region ${AWS::Region}
              unzip -o app.zip
              python3.11 -m venv venv
              venv/bin/pip install --quiet -r backend/requirements.txt
              cat > /etc/africashop.env <<ENV
              APP_ENV=aws
              AWS_REGION=${AWS::Region}
              DB_HOST=${DbEndpoint}
              DB_NAME=africashop
              DB_SECRET_ARN=${DbSecretArn}
              STORAGE_MODE=s3
              MEDIA_BUCKET=${MediaBucket}
              SERVE_FRONTEND=false
              CORS_ORIGINS=*
              ENV
              chown -R africashop /opt/africashop
              cd /opt/africashop/backend
              set -a; source /etc/africashop.env; set +a
              ok=0
              for i in 1 2 3 4 5 6 7 8; do
                if sudo -E -u africashop /opt/africashop/venv/bin/python -m app.seed; then ok=1; break; fi
                sleep 20
              done
              test "$ok" = 1
              cat > /etc/systemd/system/africashop.service <<UNIT
              [Unit]
              Description=AfricaShop API
              After=network-online.target
              [Service]
              User=africashop
              WorkingDirectory=/opt/africashop/backend
              EnvironmentFile=/etc/africashop.env
              ExecStart=/opt/africashop/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port ${AppPort} --workers 2
              Restart=always
              [Install]
              WantedBy=multi-user.target
              UNIT
              systemctl daemon-reload
              systemctl enable --now africashop
            - DbEndpoint:
                Fn::ImportValue: !Sub "${ProjectName}-DbEndpoint"
              DbSecretArn:
                Fn::ImportValue: !Sub "${ProjectName}-DbSecretArn"
              MediaBucket:
                Fn::ImportValue: !Sub "${ProjectName}-MediaBucketName"

  # ---------------------------------------------------------------- Application Load Balancer
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets:
        - Fn::ImportValue: !Sub "${ProjectName}-PublicSubnetA"
        - Fn::ImportValue: !Sub "${ProjectName}-PublicSubnetB"
      SecurityGroups:
        - Fn::ImportValue: !Sub "${ProjectName}-AlbSgId"
      LoadBalancerAttributes:
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: "true" }
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-alb" }

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId:
        Fn::ImportValue: !Sub "${ProjectName}-VpcId"
      Protocol: HTTP
      Port: !Ref AppPort
      TargetType: instance
      HealthCheckPath: /api/health
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-tg" }

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # Test direct TEMPORAIRE depuis votre IP (a laisser vide en usage normal)
  AlbIngressTest:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasTestCidr
    Properties:
      GroupId:
        Fn::ImportValue: !Sub "${ProjectName}-AlbSgId"
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: !Ref TestCidr
      Description: TEMPORAIRE test direct depuis mon poste

  # ---------------------------------------------------------------- Auto Scaling
  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 1
        MaxBatchSize: 1
        PauseTime: PT3M
    Properties:
      MinSize: !Ref MinSize
      MaxSize: !Ref MaxSize
      DesiredCapacity: !Ref DesiredCapacity
      VPCZoneIdentifier:
        - Fn::ImportValue: !Sub "${ProjectName}-AppSubnetA"
        - Fn::ImportValue: !Sub "${ProjectName}-AppSubnetB"
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      TargetGroupARNs:
        - !Ref TargetGroup
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300
      MetricsCollection:
        - Granularity: 1Minute
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-app", PropagateAtLaunch: true }
        - { Key: Project, Value: !Ref ProjectName, PropagateAtLaunch: true }

  CpuScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: !Ref CpuTargetPercent

  RequestScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ALBRequestCountPerTarget
          ResourceLabel: !Join
            - "/"
            - - !GetAtt LoadBalancer.LoadBalancerFullName
              - !GetAtt TargetGroup.TargetGroupFullName
        TargetValue: !Ref RequestsPerTarget

Outputs:
  AlbDnsName:
    Value: !GetAtt LoadBalancer.DNSName
    Export: { Name: !Sub "${ProjectName}-AlbDnsName" }
  AlbFullName:
    Value: !GetAtt LoadBalancer.LoadBalancerFullName
    Export: { Name: !Sub "${ProjectName}-AlbFullName" }
  TargetGroupFullName:
    Value: !GetAtt TargetGroup.TargetGroupFullName
    Export: { Name: !Sub "${ProjectName}-TargetGroupFullName" }
  AutoScalingGroupName:
    Value: !Ref AutoScalingGroup
    Export: { Name: !Sub "${ProjectName}-AsgName" }
  InstanceRoleArn:
    Value: !GetAtt InstanceRole.Arn
    Export: { Name: !Sub "${ProjectName}-InstanceRoleArn" }
