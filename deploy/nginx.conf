# Reverse proxy AfricaShop : joue localement le rôle de CloudFront + Application Load Balancer.
#   /         -> fichiers statiques du front      (en AWS : S3 + CloudFront)
#   /media/   -> photos des produits (volume)     (en AWS : bucket S3 photos via CloudFront)
#   /api/     -> répliques de l'API, round robin  (en AWS : ALB -> Auto Scaling group)
upstream africashop_api {
    server api:8000;          # Docker résout « api » vers TOUTES les répliques
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;   # photos de 5 Mo max
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://africashop_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503;   # comme un ALB qui écarte une cible malade
        add_header Cache-Control "no-store" always;
    }

    location /media/ {
        alias /srv/media/;
        expires 7d;
        add_header Cache-Control "public" always;
    }

    location /assets/ {
        expires 1h;
        add_header Cache-Control "public" always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    error_page 404 /error.html;
}
